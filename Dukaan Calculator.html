<head>

<title>Dukaan Calculator</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#111;--bg:#fff;--g:#0b6e3a;--o:#c2410c;--line:#d4d4d4;--soft:#f3f3f3}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{-webkit-user-select:none;user-select:none;-webkit-appearance:none;appearance:none}
#bug{background:#b00020;color:#fff;font-size:15px;padding:10px;border-radius:10px;word-break:break-all}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;padding:14px 14px 20px;min-height:100vh;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.title{font-size:20px;font-weight:800}
.back{background:var(--soft);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-size:16px;font-weight:700;min-height:44px}
.big{width:100%;border-radius:20px;padding:20px;text-align:left;color:#fff;min-height:110px}
.big b{display:block;font-size:30px;font-weight:900;letter-spacing:.5px}
.big span{display:block;font-size:16px;margin-top:10px;line-height:1.3}
.sp{flex:1}
.small{background:var(--soft);border:2px solid var(--ink);border-radius:14px;padding:14px 8px;font-size:17px;font-weight:700;min-height:52px}
input[type=text],input[type=search],input[type=number],select{font:inherit;width:100%;border:2px solid var(--ink);border-radius:12px;padding:14px;font-size:22px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 18px;text-align:left;min-height:96px;display:block;width:100%}
.item b{display:block;font-size:24px;font-weight:800}
.item span{display:block;font-size:18px;margin-top:2px;color:#333}
.q{font-size:19px;font-weight:700;margin:2px 0}
.res{border:3px solid var(--ink);border-radius:20px;padding:16px 18px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center}
.res .n{font-size:20px;font-weight:800}
.res .a{font-size:22px;font-weight:700;margin-top:2px}
.res .r{font-size:80px;font-weight:900;line-height:1.05;margin:6px 0}
.res .m{font-size:19px;font-weight:700}
.res .note{font-size:17px;margin-top:6px;color:#444}
.res.empty .r{font-size:40px;color:#888}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.k{background:var(--soft);border:2px solid var(--ink);border-radius:16px;font-size:30px;font-weight:800;min-height:76px}
.k.on{color:#fff}
.k.cu{background:#fff;font-size:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .item{min-height:76px;padding:10px 12px}
.g2 .item b{font-size:20px}
.g2 .item span{font-size:16px}
.k.wide{grid-column:span 3}
.pad .k{min-height:68px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.field label{font-size:18px;font-weight:700}
.tier{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.tier h3{margin:0 0 8px;font-size:20px}
.save{background:var(--g);color:#fff;border-radius:16px;font-size:26px;font-weight:900;min-height:70px;width:100%}
.danger{background:#fff;border:2px solid var(--o);color:var(--o);border-radius:14px;font-size:20px;font-weight:800;min-height:60px;width:100%}
.danger.arm{background:var(--o);color:#fff}
.err{color:#b00020;font-weight:700;font-size:18px;min-height:22px}
.empty-msg{font-size:20px;padding:20px;text-align:center;color:#555}

body{background:#f4f6f1}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:14px;background:#0b6e3a;display:grid;place-items:center;font-size:26px}
.title{font-weight:900}
.big{flex:1 1 auto;max-height:210px;box-shadow:0 6px 0 rgba(0,0,0,.2);border-radius:24px;display:flex;flex-direction:column;justify-content:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:2px solid #d9ddd5;border-radius:20px;box-shadow:0 4px 0 #cfd4cb;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:17px}
.tile i{font-style:normal;font-size:32px;line-height:1.1}
.big:active,.k:active,.item:active,.tile:active,.small:active,.back:active{transform:translateY(2px)}
.item{border:2px solid #e2e5df;box-shadow:0 3px 0 #d5d9d1;background:#fff}
.k{border:0;box-shadow:0 4px 0 #c9cec6;background:#fff}
.k.on{box-shadow:0 4px 0 rgba(0,0,0,.3)}
.res{background:#fff;box-shadow:0 4px 0 #d5d9d1}
.back,.small{background:#fff;border:2px solid #cfd4cb;box-shadow:0 2px 0 #cfd4cb}
input:focus,select:focus{outline:3px solid rgba(11,110,58,.3);border-color:var(--g)}
.tier{background:#fff}
.tiles{grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:96px;font-size:17px;border-radius:20px}
.tile i{font-size:32px}
textarea{font:inherit;width:100%;border:2px solid var(--ink);border-radius:12px;padding:12px;font-size:14px;min-height:110px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.box{background:#fff;border:3px solid #cfd4cb;border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700;width:100%;text-align:left}
.box b{font-size:34px;font-weight:900}
.box.on{border-color:var(--g);background:#effaf2}
.ok{color:#0b6e3a;font-weight:800;font-size:18px;min-height:22px}
.row3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{border-radius:12px;padding:12px 4px;font-size:16px;font-weight:800;background:#fff;border:2px solid #cfd4cb;box-shadow:0 2px 0 #cfd4cb}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#fff;border:2px solid #d9ddd5;border-radius:16px;padding:10px 4px;text-align:center}
.card small{display:block;font-size:13px;font-weight:700;color:#444}
.card b{display:block;font-size:20px;font-weight:900;margin-top:2px}
.pos{color:#0b6e3a}.neg{color:#c62828}
.tile{min-height:84px}
.g4{grid-template-columns:repeat(4,1fr);gap:8px}
.g4 .k{font-size:24px;min-height:66px;padding:0 2px}
.g4 .k small{font-size:11px!important}
.g4 .k.wide{grid-column:span 4;font-size:20px;min-height:56px}
.billbar{display:flex;justify-content:space-between;align-items:center;width:100%;background:#e8f5e9;border:2px solid #0b6e3a;border-radius:14px;padding:12px 14px;font-size:18px;font-weight:800;color:#0b6e3a}
#app.cm{gap:8px;padding-top:8px;padding-bottom:12px}
.cm .top{min-height:44px}
.cm .res{min-height:0;padding:8px 12px}
.cm .res .n{font-size:16px}
.cm .res .a{font-size:17px;margin-top:0}
.cm .res .r{font-size:54px;margin:2px 0}
.cm .res .m{font-size:16px}
.cm .res .note{display:none}
.cm .res.empty .r{font-size:28px}
.cm #resbox .save{min-height:56px!important;margin-top:8px!important;font-size:22px}
.cm .pad{gap:8px}
.cm .pad .k{min-height:54px;font-size:26px}
.cm .k.cu.wide{min-height:48px;font-size:17px}
.cm .box b{font-size:28px}
.cm .tab{padding:8px 12px;font-size:15px}
.g4 .k.chip{min-height:46px;font-size:17px;background:#e8f5e9;color:#0b6e3a;box-shadow:0 3px 0 #b7d9bf}
.g5{grid-template-columns:repeat(5,1fr);gap:6px}
.g5 .k{min-height:42px;font-size:17px;padding:0;box-shadow:0 3px 0 #c9cec6}
.cm .pad .k{min-height:50px}
.cm #resbox .save{min-height:52px!important}
.star{position:absolute;top:4px;right:4px;width:42px;height:42px;border-radius:12px;background:transparent;font-size:24px;padding:0;line-height:1}
.g2 .item.pk b{padding-right:30px}
.item.pk{flex:1}
/* aesthetic pass */
:root{--bg:#fbf6ec;--ink:#1f2a1f;--g:#166534;--o:#c2410c;--line:#e7dfcf;--soft:#f4efe3}
body{background:radial-gradient(900px 420px at 50% -8%,#fff3d1 0,rgba(255,243,209,0) 65%),#fbf6ec;font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.title{letter-spacing:-.2px}
.logo{background:linear-gradient(135deg,#22a05a,#14532d);box-shadow:0 4px 10px rgba(22,101,52,.35)}
.sub{font-size:12px;font-weight:600;color:#6b7a63;margin-top:1px}
.big{position:relative;overflow:hidden;border-radius:26px;box-shadow:0 12px 22px -10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.28)}
.big::after{position:absolute;right:12px;bottom:-16px;font-size:100px;opacity:.17;line-height:1;pointer-events:none}
#app>.big:first-of-type::after{content:"₹"}
#app>.big:last-of-type::after{content:"⚖️"}
.big b{letter-spacing:.3px;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.tile{border-radius:22px;border-width:1.5px;box-shadow:0 8px 14px -8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.8)}
.tile i{background:#fff;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:25px;box-shadow:0 3px 8px rgba(0,0,0,.12);margin-bottom:5px}
.back,.small{border-radius:14px;border:1.5px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.07)}
.item{border-radius:20px;border:1.5px solid var(--line);border-left-width:8px!important;box-shadow:0 6px 12px -8px rgba(0,0,0,.25)}
.res{border-radius:24px;box-shadow:0 12px 22px -14px rgba(0,0,0,.35);background:linear-gradient(180deg,#fff,#fffaf0)}
.res .r{letter-spacing:-2px}
.k{border-radius:18px;box-shadow:0 3px 0 #e1d9c6,0 8px 10px -8px rgba(0,0,0,.25);background:#fff}
.k:active{background:#f1ead8}
.k.on{box-shadow:0 3px 0 rgba(0,0,0,.25)}
.save{border-radius:18px;background:linear-gradient(135deg,#22a05a,#166534);box-shadow:0 10px 16px -10px rgba(22,101,52,.8);text-shadow:0 1px 1px rgba(0,0,0,.15)}
.danger{border-radius:16px}
.box{border-radius:18px;border:2px solid var(--line)}
.box.on{border-color:#22a05a;background:#f0fdf4}
.billbar{border-radius:18px;background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:#22a05a;box-shadow:0 8px 14px -10px rgba(22,101,52,.7)}
input,select,textarea{border-radius:16px;border-color:#d8cfbb;background:#fff}
.g5 .k,.g4 .k{border-radius:15px}
.card,.tier,.tab{border-radius:16px}
button,.title,.box,.res div,.item span,.item b{line-height:1.3}
.tile{line-height:1.25}
#app.fx{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;overflow:hidden;gap:8px;padding-top:8px;padding-bottom:12px}
.fx .top{min-height:44px}
.fxres{flex:0 0 auto;height:clamp(118px,22vh,170px);background:linear-gradient(180deg,#fff,#fffaf0);border:2px solid #e0d6c0;border-radius:24px;padding:10px 16px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden;box-shadow:0 12px 22px -14px rgba(0,0,0,.35)}
.fxres .n{font-size:15px;font-weight:800;color:#6b5f48;margin-bottom:auto}
.fxline{max-width:100%;overflow-x:auto;white-space:nowrap;scrollbar-width:none;font-size:22px;font-weight:700;color:#6b5f48;line-height:1.3}
.fxline::-webkit-scrollbar{display:none}
.fxbig{font-weight:900;line-height:1.1;font-size:60px;max-width:100%;white-space:nowrap;overflow:hidden;letter-spacing:-1px}

.fxgrid .k{min-height:0;height:100%;font-size:28px;padding:0}
.fx .box{padding:6px 14px;flex:0 0 auto}
.fx .box b{font-size:26px}
.fx .save{flex:0 0 auto}
.fx .row{flex:0 0 auto}
.fx .hd{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:auto;gap:8px}
.fx .hd .n{margin:0;font-size:17px;color:#1f2a1f}
.fx .tg{display:flex;gap:6px}
.fx .tg .tab{padding:6px 12px;font-size:14px}
.fx .msg{font-size:15px;font-weight:700;color:#4b5563;min-height:20px;text-align:right;line-height:1.25}
.fx .g5{flex:0 0 auto}
.back.arm{background:#c2410c;color:#fff;border-color:#c2410c}
.fxres.amt{height:clamp(160px,25vh,196px);padding:10px 16px 8px}
.fxres.amt .fxbig{font-size:52px}

.fx .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lockwrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:6px 4px}

.lockt{font-size:24px;font-weight:900;letter-spacing:-.3px}
.locks{font-size:15px;font-weight:600;color:#6b7a63;max-width:300px;line-height:1.35}
.pwf{position:relative;width:100%}
.pwf input{padding:16px 56px 16px 16px;font-size:20px;text-align:left;min-height:56px}
.pwf button{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;font-size:22px;padding:8px 12px}
.pws{min-height:22px;font-size:15px;font-weight:800;color:#6b7a63}
.pws.good{color:#166534}.pws.bad{color:#c62828}
.lnk{background:transparent;border:0;box-shadow:none;color:#166534;font-weight:800;font-size:16px;padding:10px;text-decoration:underline}
